[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ember"
version = "1.0.0"
description = "Ember: contextual gene embeddings from single-cell RNA-seq"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.9.1",
    "numpy==1.26.4",
    "pandas==2.3.3",
    "scipy==1.17.0",
    "scikit-learn==1.8.0",
    "anndata==0.12.7",
    "h5py==3.15.1",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "accelerate==1.12.0",
    "tqdm==4.67.1",
    "huggingface_hub>=1.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.19"]
dev = ["pytest>=8"]
plot = ["matplotlib==3.10.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ember*"]

# PyTorch CUDA 12.6 wheels. Comment out both blocks to install the default
# (CPU / PyPI) torch build instead.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
